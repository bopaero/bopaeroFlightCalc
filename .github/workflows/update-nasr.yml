name: Update FAA NASR Data

on:
  schedule:
    # Run daily at 06:00 UTC — idempotent (only commits when cycle advances),
    # so daily cadence guarantees we pick up the new 28-day NASR cycle the day it rolls over.
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-nasr:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute NASR cycle date
        id: cycle
        run: |
          python3 -c "
          from datetime import datetime, timedelta
          anchor = datetime(2021, 1, 28)
          now = datetime.utcnow()
          days = (now - anchor).days
          cycles = days // 28
          cycle_date = anchor + timedelta(days=cycles * 28)
          # FAA uses 'DD_Mon_YYYY' format for the zip URL, with the day
          # ZERO-PADDED to two digits (e.g. '09_Jul_2026', not '9_Jul_2026').
          months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
          mon = months[cycle_date.month - 1]
          zip_date = f'{cycle_date.day:02d}_{mon}_{cycle_date.year}'
          iso_date = cycle_date.strftime('%Y-%m-%d')
          print(f'ZIP_DATE={zip_date}')
          print(f'ISO_DATE={iso_date}')
          " >> "$GITHUB_OUTPUT"

      - name: Download and extract FAA APT data
        run: |
          ZIP_DATE="${{ steps.cycle.outputs.ZIP_DATE }}"
          ISO_DATE="${{ steps.cycle.outputs.ISO_DATE }}"
          URL="https://nfdc.faa.gov/webContent/28DaySub/extra/${ZIP_DATE}_APT_CSV.zip"
          echo "Fetching: $URL"
          # -f makes curl exit non-zero on HTTP 4xx/5xx (e.g. a wrong cycle URL)
          # so the step fails clearly instead of saving an HTML error page and
          # dying later with a cryptic "not a zipfile" error from unzip.
          curl -fsSL -o apt_csv.zip "$URL"
          unzip -o apt_csv.zip APT_BASE.csv

          # Extract ARPT_ID + FACILITY_USE_CODE, and fuel types
          python3 -c "
          import csv, sys
          with open('APT_BASE.csv') as f:
              r = csv.DictReader(f)
              rows = []
              fuel_rows = []
              for row in r:
                  rows.append((row['ARPT_ID'], row['FACILITY_USE_CODE']))
                  fuel = row.get('FUEL_TYPES','').strip()
                  if fuel and row['FACILITY_USE_CODE'] == 'PU':
                      fuel_rows.append((row['ARPT_ID'], fuel))
          with open('data/faa_public_use.csv', 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['LOCATION_ID', 'FACILITY_USE_CODE'])
              w.writerows(rows)
          with open('data/faa_fuel.csv', 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['LOCATION_ID', 'FUEL_TYPES'])
              w.writerows(fuel_rows)
          pu = sum(1 for _, u in rows if u == 'PU')
          print(f'Extracted {len(rows)} airports ({pu} public-use, {len(fuel_rows)} with fuel)')
          "

          # Write cycle metadata
          echo "$ISO_DATE" > data/nasr_cycle.txt

          # Cleanup
          rm -f apt_csv.zip APT_BASE.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to NASR data"
          else
            ISO_DATE="${{ steps.cycle.outputs.ISO_DATE }}"
            git commit -m "Update FAA NASR data — cycle ${ISO_DATE}"
            git push
          fi
